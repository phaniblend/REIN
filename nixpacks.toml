[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
# NODE_ENV=production would otherwise omit Tailwind and TypeScript.
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start:railway"

[variables]
NIXPACKS_NODE_VERSION = "22"
NODE_ENV = "production"
